name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=results.trx"

      - name: Publish single exe
        run: dotnet publish src/RebootWhy.App -p:PublishProfile=win-x64

      - uses: actions/upload-artifact@v5
        with:
          name: RebootWhy-win-x64
          path: publish/win-x64/RebootWhy.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"
